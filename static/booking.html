<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seating Chart</title>
<style>
  /* --- General Layout --- */
  body {
    font-family: sans-serif;
    background-color: #f4f4f4;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }

  /* --- Legend Styles --- */
  .legend {
    display: flex;
    gap: 30px;
    margin-bottom: 50px;
  }
  .legend-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 14px;
    font-weight: bold;
  }
  .legend-box {
    width: 50px;
    height: 30px;
    border: 1px solid #333;
    margin-bottom: 8px;
  }

  /* --- Patterns for Seats --- */
  .available { background-color: white; }
  
  .booked { 
    background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, #666 4px, #666 5px);
  }
  
  .maintenance { 
    background-image: repeating-linear-gradient(45deg, #ccc, #ccc 2px, transparent 2px, transparent 4px), 
                      repeating-linear-gradient(-45deg, #ccc, #ccc 2px, transparent 2px, transparent 4px); 
    background-color: white;
  }

  /* --- Venue Layout --- */
  .venue {
    display: flex;
    gap: 40px;
    align-items: flex-end;
    margin-bottom: 40px;
  }

  .section-column {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .section-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  /* --- Seats Grid --- */
  .seat-grid {
    display: grid;
    gap: 4px;
    border: 2px solid #333;
    padding: 10px;
    background-color: #fff;
  }

  .seat {
    width: 30px;
    height: 30px;
    border: 1px solid #333;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .seat:hover:not(.booked):not(.maintenance) {
    transform: scale(1.1);
    background-color: #d1e7dd; /* Greenish highlight on hover */
  }

  /* --- Specific Section Grids --- */
  
  /* Section B (Left) */
  #section-B .seat-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  /* Section A (Center) */
  .section-A-wrapper {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }
  .section-A-top .seat-grid, .section-A-middle .seat-grid {
    grid-template-columns: repeat(5, 1fr);
  }
  .section-A-middle .seat-grid {
     grid-template-rows: repeat(6, 1fr);
  }

  /* Section C (Right) */
  #section-C .seat-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  /* --- Stairs --- */
  .stairs {
    margin-top: 10px;
    font-size: 14px;
    color: #555;
    border: 1px solid #ccc;
    padding: 5px 20px;
    background: #eee;
  }

  /* --- Section D (Bottom) --- */
  .section-D {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-D .seat-grid {
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }
  .section-D .stairs {
    margin-top: 0;
    padding: 20px 5px;
  }

</style>
</head>
<body>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-box available"></div>
      <span>Available</span>
    </div>
    <div class="legend-item">
      <div class="legend-box booked"></div>
      <span>Booked</span>
    </div>
    <div class="legend-item">
      <div class="legend-box maintenance"></div>
      <span>Maintenance</span>
    </div>
  </div>

  <!-- Venue Area (Top 3 sections) -->
  <div class="venue">
    
    <!-- Section B -->
    <div class="section-column" id="section-B">
      <div class="section-title">B</div>
      <div class="seat-grid" id="grid-B">
        <!-- Seats will be generated by JS -->
      </div>
      <div class="stairs">stairs</div>
    </div>

    <!-- Section A -->
    <div class="section-A-wrapper">
      <div class="section-A-top">
        <div class="seat-grid" id="grid-A-top"></div>
      </div>
      <div class="section-A-middle">
        <div class="section-title" style="text-align:center;">A</div>
        <div class="seat-grid" id="grid-A-middle"></div>
      </div>
    </div>

    <!-- Section C -->
    <div class="section-column" id="section-C">
      <div class="section-title">C</div>
      <div class="seat-grid" id="grid-C">
        <!-- Seats will be generated by JS -->
      </div>
      <div class="stairs">stairs</div>
    </div>

  </div>

  <!-- Section D (Bottom) -->
  <div class="section-D">
    <div class="stairs">stairs</div>
    <div class="seat-grid" id="grid-D">
       <!-- Seats will be generated by JS -->
    </div>
    <div class="stairs">stairs</div>
  </div>

  <script>
    // A helper function to generate seats dynamically so you don't have to write 100 <div> tags
    function generateSeats(containerId, totalSeats, bookedPercent, maintenancePercent) {
      const container = document.getElementById(containerId);
      
      for (let i = 0; i < totalSeats; i++) {
        const seat = document.createElement('div');
        seat.classList.add('seat');
        
        // Randomly assign status for demonstration purposes
        const rand = Math.random() * 100;
        if (rand < bookedPercent) {
          seat.classList.add('booked');
        } else if (rand < bookedPercent + maintenancePercent) {
          seat.classList.add('maintenance');
        } else {
          seat.classList.add('available');
        }

        // Add click event to select seat
        seat.addEventListener('click', function() {
          if (!this.classList.contains('booked') && !this.classList.contains('maintenance')) {
            this.classList.toggle('selected');
            // Toggle a green background for selected seats
            if (this.classList.contains('selected')) {
              this.style.backgroundColor = '#198754'; 
            } else {
              this.style.backgroundColor = ''; // Reverts to CSS class
            }
          }
        });

        container.appendChild(seat);
      }
    }

    // Generate the seats (Total Seats, % Booked, % Maintenance)
    generateSeats('grid-B', 18, 30, 10);
    generateSeats('grid-A-top', 5, 20, 0);
    generateSeats('grid-A-middle', 30, 40, 10);
    generateSeats('grid-C', 18, 50, 5);
    generateSeats('grid-D', 24, 15, 10);

  </script>
</body>
</html>
