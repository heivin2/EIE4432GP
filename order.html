<div class="container py-4 flex-grow-1"> 
  <main  class="flex-fill">
    <form id="order-form" method="POST" onsubmit="placeOrder(event);">

      <div class="name-input mb-3 w-100">
        <label for="name">Name:</label>
        <input type="text" class="form-control" id="name" name="name"required>
      </div>

      <div class="drink-select mb-3 w-100">
        <label for="drink">Drink:</label>
        <select id="drink" name="drink" class="form-control form-select" onchange="calculatePrice()">
          <option value="default">Please Select</option>
          <option value="bubble-milktea">Bubble Milktea</option>
          <option value="iced-latte">Iced Latte</option>
        </select>
      </div>


  <div class="size-select d-inline-block d-lg-flex">
        <!-- Old Version: <label for="size">Size:</label>       -->
        <!-- Fixed: replaced invalid label for="size" with span -->
        <!-- New Version:  <span>Size:</span> -->
      <div class="col d-flex d-lg-block">
        <label class="form-label">Size:</label>
        
        <div class="mb-2 ms-2 ms-lg-0">
            <input type="radio" id="small" name="size" value="small" class="btn-check" onchange="calculatePrice()">
            <label for="small" class="btn btn-outline-success">Small</label>
        </div>
        
        <div class="mb-2 ms-2 ms-lg-0">
            <input type="radio" id="medium" name="size" value="medium" class="btn-check" onchange="calculatePrice()">
            <label for="medium" class="btn btn-outline-success">Medium</label>
        </div>
        
        <div class="mb-2 ms-2 ms-lg-0">
            <input type="radio" id="large" name="size" value="large" class="btn-check" onchange="calculatePrice()">
            <label for="large" class="btn btn-outline-success">Large</label>
        </div>
      </div>
    


    <div class="col d-flex d-lg-block">
        <label class="form-label">Ice:</label>
        
        <div class="mb-2 ms-2 ms-lg-0">
            <input type="radio" id="normal" name="ice" value="normal" class="btn-check" onchange="calculatePrice()">
            <label for="normal" class="btn btn-outline-success">Normal</label>
        </div>
        
        <div class="mb-2 ms-2 ms-lg-0">
            <input type="radio" id="less" name="ice" value="less" class="btn-check" onchange="calculatePrice()">
            <label for="less" class="btn btn-outline-success">Less</label>
        </div>
        
        <div class="mb-2 ms-2 ms-lg-0">
            <input type="radio" id="without-ice" name="ice" value="without ice" class="btn-check" onchange="calculatePrice()">
            <label for="without-ice" class="btn btn-outline-success">Without ice</label>
        </div>
    </div>


    <div class="col d-flex d-lg-block">
        <label class="form-label">Sweetness:</label>
        
        <div class="mb-2 ms-2 ms-lg-0">
            <input type="radio" id="full" name="sweetness" value="full" class="btn-check" onchange="calculatePrice()">
            <label for="full" class="btn btn-outline-success">Full</label>
        </div>
        
        <div class="mb-2 ms-2 ms-lg-0">
            <input type="radio" id="half" name="sweetness" value="half" class="btn-check" onchange="calculatePrice()">
            <label for="half" class="btn btn-outline-success">Half</label>
        </div>
        
        <div class="mb-2 ms-2 ms-lg-0">
            <input type="radio" id="none" name="sweetness" value="none" class="btn-check" onchange="calculatePrice()">
            <label for="none" class="btn btn-outline-success">None</label>
        </div>
    </div>
  </div>
   

    <div class="row mb-3">
	    <div class="fs-3 fw-semibold">Price: $<span id="price">0</span></div>
    </div>

      <div class="submission">
        <input type="submit" type="button" style="background-color: green;  color: white; border: none; padding: 10px;"  value="Place Order" onclick="placeOrder(event)">
        
        <input type="reset" type="button" style="background-color: yellow; border:none; padding: 10px;" value="Reset">
      </div>
    </div>
    </form>
  </main>
</div>
